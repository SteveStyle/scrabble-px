name: Project
description: A bounded piece of work that owns requirements, a design, and one or more deliveries
type: Project
body:
  - type: markdown
    attributes:
      value: |
        **A project is where work happens; a requirement issue is where it was
        noticed.** Raise this one when a requirement justifies a project — even
        a single requirement, because the two bodies have opposite lifecycles.
        This one is kept current; a requirement issue is never edited.

        **Then fold the requirement issues into it**: copy what matters here
        first, then close each with the `folded` label and a comment naming this
        project. Fold *before* you freeze — closing an issue whose requirement
        was never copied loses it.

        **Short is right.** A small project holds all six headings as text; a
        larger one links to documents in `docs/changes/…` and keeps the body
        brief so the two do not drift. See
        [docs/3.6 §2.11](https://github.com/delphside/tile-lite-elite/blob/main/docs/3.6-change-lifecycle.md).

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: >-
        What must be true when this is done, and the issues folded in. What is
        out of scope is worth saying too.
      value: |
        **R1 · **

        **Out of scope.**
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design
      description: >-
        How it will be done — text here, or a link to a design note. **Include
        the context**: where the shape was chosen because of other work, say
        which work, so that if it is dropped the shape becomes reviewable rather
        than mysterious.
    validations:
      required: true

  - type: textarea
    id: artefacts
    attributes:
      label: Impacted artefacts
      description: >-
        Everything it touches, each new or modified, grouped by delivery. A guess
        now, accurate once the design is agreed — and worth writing wrong,
        because it is how two projects discover they collide. Route is derived
        from the artefact; show it as a column.
      value: |
        *Provisional until the design is agreed.*

        | artefact | | route |
        | --- | --- | --- |
        | | | |
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: >-
        One line per relation, naming the issue and the reason. **waits on** —
        cannot start or ship until that one has. **overlaps** — touches the same
        artefact, which comparing artefact lists will tell you. **anticipates** —
        this design makes room for that project, and naming it is what keeps it
        from being speculation.
      value: |
        - **waits on #** — 
        - **overlaps #** — 
        - **anticipates #** — 
    validations:
      required: true

  - type: textarea
    id: test-approach
    attributes:
      label: Test approach
      description: >-
        Environment, tools, and what is measured against what criteria. Plus the
        two questions every delivery answers: does this involve functional
        changes needing user testing, and technical changes needing technical
        testing?
    validations:
      required: true

  - type: textarea
    id: post-deployment-check
    attributes:
      label: Post-deployment check
      description: >-
        **What would show this worked, once it is live?** Not the tests — those
        are above, and they run before it ships. This is the thing somebody looks
        at afterwards to say the benefit arrived: a number that moved, a failure
        that stopped happening, a release that behaved.

        Written now, while the intent is fresh, because by the time the check is
        due the project has been closed out of everybody's head. Without it,
        *"check it is working and giving the benefit expected"* has to be
        reconstructed from the design, and usually is not.

        For a `no-release` project it is often the **next application release**
        behaving as expected — say so, and say what would count as it not.
      placeholder: |
        The next production deploy settles its milestone with every project left
        open at Post-deployment rather than closed, and its version bump reaches
        main. If the bump is refused, the bypass is wrong.
    validations:
      required: true

  - type: textarea
    id: deliveries
    attributes:
      label: Deliveries
      description: >-
        One runbook per delivery. The steps and their routes now; the commands
        before the delivery starts; which version carried each step, and when,
        afterwards.
      value: |
        ### Delivery 1 — 

        | # | step | route |
        | --- | --- | --- |
        | 1 | | |
    validations:
      required: true
