# TEMPORARY PROBE — delete after #323 is answered.
#
# Does GitHub Actions accept `sub_issues` as a trigger? The webhook event exists
# and carries `parent_issue_added`; Actions supports only a subset of webhook
# events, and a workflow with an unsupported trigger fails by never running,
# silently. This asks the question in the only way that answers it.
name: probe sub_issues trigger
on:
  sub_issues:
    types: [parent_issue_added]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "sub_issues fired for issue #${{ github.event.issue.number }}"
